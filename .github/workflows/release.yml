name: Build & Release

# Trigger: push a version tag, e.g.:
#   git tag v1.0.0
#   git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create/update GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: JobBoardScraper-windows.exe
            exe_src: dist/JobBoardScraper.exe
          - os: macos-latest
            artifact: JobBoardScraper-macos.zip
            exe_src: dist/JobBoardScraper.app
          - os: ubuntu-latest
            artifact: JobBoardScraper-linux
            exe_src: dist/JobBoardScraper

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Build executable
        run: pyinstaller jobboard.spec

      - name: Package output
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cd dist && zip -r JobBoardScraper-macos.zip JobBoardScraper.app
          else
            mv "${{ matrix.exe_src }}" "dist/${{ matrix.artifact }}"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/${{ matrix.artifact }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
