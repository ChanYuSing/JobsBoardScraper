query jobDetails($jobId: ID!, $jobDetailsViewedCorrelationId: String!, $sessionId: String!, $zone: Zone!, $locale: Locale!, $languageCode: LanguageCodeIso!, $countryCode: CountryCodeIso2!, $timezone: Timezone!, $visitorId: UUID!, $isAuthenticated: Boolean!, $enableJdvBadge: Boolean!) {
  jobDetails(
    id: $jobId
    tracking: {channel: "WEB", jobDetailsViewedCorrelationId: $jobDetailsViewedCorrelationId, sessionId: $sessionId}
  ) {
    ...job
    insights @include(if: $isAuthenticated) {
      ... on ApplicantCount {
        volumeLabel(locale: $locale)
        count
        __typename
      }
      __typename
    }
    learningInsights(platform: WEB, zone: $zone, locale: $locale) {
      analytics
      content
      __typename
    }
    gfjInfo {
      location {
        countryCode
        country(locale: $locale)
        suburb(locale: $locale)
        region(locale: $locale)
        state(locale: $locale)
        postcode
        __typename
      }
      workTypes {
        label
        __typename
      }
      company {
        url(locale: $locale, zone: $zone)
        __typename
      }
      __typename
    }
    workArrangements(visitorId: $visitorId, channel: "JDV", platform: WEB) {
      arrangements {
        type
        label(locale: $locale)
        __typename
      }
      label(locale: $locale)
      __typename
    }
    seoInfo {
      normalisedRoleTitle
      workType
      classification
      subClassification
      where(zone: $zone)
      broaderLocationName(locale: $locale)
      normalisedOrganisationName
      __typename
    }
    __typename
  }
}

fragment badges on JobDetails {
  badges(visitorId: $visitorId, platform: WEB, locale: $locale) @include(if: $enableJdvBadge) {
    badges {
      badge
      displayText(locale: $locale)
      ... on JobDetailsInteractiveBadge {
        message(locale: $locale, zone: $zone)
        __typename
      }
      ... on JobDetailsResponsiveHirerBadge {
        message(locale: $locale, zone: $zone)
        badgeScore
        __typename
      }
      __typename
    }
    __typename
  }
  __typename
}

fragment job on JobDetails {
  job {
    sourceZone
    tracking {
      adProductType
      classificationInfo {
        classificationId
        classification
        subClassificationId
        subClassification
        __typename
      }
      hasRoleRequirements
      isPrivateAdvertiser
      locationInfo {
        area
        location
        locationIds
        __typename
      }
      workTypeIds
      postedTime
      __typename
    }
    id
    title
    phoneNumber
    isExpired
    expiresAt {
      dateTimeUtc
      __typename
    }
    isLinkOut
    contactMatches {
      type
      value
      __typename
    }
    isVerified
    abstract
    content(platform: WEB)
    status
    listedAt {
      label(context: JOB_POSTED, length: SHORT, timezone: $timezone, locale: $locale)
      dateTimeUtc
      __typename
    }
    salary {
      currencyLabel(zone: $zone)
      label
      __typename
    }
    shareLink(platform: WEB, zone: $zone, locale: $locale)
    workTypes {
      label(locale: $locale)
      __typename
    }
    advertiser {
      id
      name(locale: $locale)
      isVerified
      registrationDate {
        dateTimeUtc
        __typename
      }
      __typename
    }
    location {
      label(locale: $locale, type: LONG)
      __typename
    }
    classifications {
      label(languageCode: $languageCode)
      __typename
    }
    products {
      branding {
        id
        cover {
          url
          __typename
        }
        thumbnailCover: cover(isThumbnail: true) {
          url
          __typename
        }
        logo {
          url
          __typename
        }
        __typename
      }
      bullets
      questionnaire {
        questions
        __typename
      }
      video {
        url
        position
        __typename
      }
      __typename
    }
    __typename
  }
  ...badges
  companyProfile(zone: $zone) {
    id
    name
    companyNameSlug
    shouldDisplayReviews
    branding {
      logo
      __typename
    }
    overview {
      description {
        paragraphs
        __typename
      }
      industry
      size {
        description
        __typename
      }
      website {
        url
        __typename
      }
      __typename
    }
    reviewsSummary {
      overallRating {
        numberOfReviews {
          value
          __typename
        }
        value
        __typename
      }
      __typename
    }
    perksAndBenefits {
      title
      __typename
    }
    __typename
  }
  companySearchUrl(zone: $zone, languageCode: $languageCode)
  companyTags {
    key(languageCode: $languageCode)
    value
    __typename
  }
  restrictedApplication(countryCode: $countryCode) {
    label(locale: $locale)
    __typename
  }
  sourcr {
    image
    imageMobile
    link
    __typename
  }
  __typename
}