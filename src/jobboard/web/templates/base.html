<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}JobBoard{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"/>
  <style>
    :root { --pico-font-size: 14px; }
    body { padding: 0; }
    nav.topnav { padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--pico-muted-border-color); }
    nav.topnav ul { margin: 0; }
    nav.topnav a { text-decoration: none; font-weight: 500; }
    nav.topnav a.active { color: var(--pico-primary); }
    .container-fluid { padding: 1.5rem; }
    table { font-size: 0.9rem; }
    table td, table th { white-space: nowrap; }
    .table-scroll table { min-width: max-content; }
    /* filter forms: flex row, bottom-aligned labels, no rogue Pico margins */
    /* chips: multi-select (Days of week, Column picker) */
    .chip-row { display:flex; gap:0.3rem; flex-wrap:wrap; align-items:center; }
    .chip-item { display:inline-flex; align-items:center; }
    .chip-item input[type=checkbox] { display:none !important; }
    .chip-item label { display:inline-flex !important; align-items:center; justify-content:center; padding:0.22rem 0.65rem; border:1.5px solid var(--pico-muted-border-color); border-radius:5px; cursor:pointer; font-size:0.82rem; line-height:1.4; user-select:none; margin:0 !important; white-space:nowrap; color:inherit; font-weight:400; }
    .chip-item input[type=checkbox]:checked + label { background:var(--pico-primary) !important; color:#fff !important; border-color:var(--pico-primary) !important; font-weight:500; }
    .chip-item[draggable] { cursor: grab; }
    .chip-item.dragging { opacity: 0.4; }
    .chip-row-days .chip-item label { min-width:3.2rem; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-ok      { background: #d1fae5; color: #065f46; }
    .badge-error   { background: #fee2e2; color: #991b1b; }
    .badge-exhausted { background: #fef3c7; color: #92400e; }
    .badge-running { background: #dbeafe; color: #1e40af; }
    .badge-cancelled { background: #f3f4f6; color: #6b7280; }
    .badge-queued  { background: #fef9c3; color: #713f12; }
    .badge-saved      { background: #ede9fe; color: #4c1d95; }
    .badge-dismissed  { background: #f3f4f6; color: #6b7280; }
    .badge-new        { background: #f0f9ff; color: #0369a1; }
    .badge-jobsdb     { background: #fff7ed; color: #c2410c; }
    .badge-linkedin_guest { background: #eff6ff; color: #1d4ed8; }
    .flash-msg { padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1rem; background: #d1fae5; color: #065f46; }
    .flash-error { background: #fee2e2; color: #991b1b; }
    /* column picker — always-visible chip row above the table */
    .col-picker-form { margin-bottom: 0.35rem; }
    .col-picker { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; padding: 0.4rem 0; border-bottom: 1px solid var(--pico-muted-border-color); }
    .col-picker__label { font-size: 0.78rem; font-weight: 700; color: var(--pico-muted-color); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; flex-shrink: 0; }
    .col-picker__apply { padding: 0.18rem 0.7rem !important; font-size: 0.8rem !important; margin: 0 !important; flex-shrink: 0; }
    /* status bar */
    .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0 0.5rem; font-size: 0.85rem; }
    .status-bar__count { color: var(--pico-muted-color); }
    .status-bar__count strong { color: var(--pico-color); }
    .status-bar__clear { color: var(--pico-muted-color); text-decoration: none; font-size: 0.82rem; }
    .status-bar__clear:hover { color: var(--pico-primary); }
    /* column header filter system */
    .table-scroll { overflow-x: auto; width: 100%; }
    .th-inner { display: flex; align-items: center; gap: 0.2rem; white-space: nowrap; }
    /* interactive text design language — shared by column header filter buttons and job title links */
    .th-filter-btn { background: none; border: 1px solid var(--pico-muted-border-color); padding: 0.1rem 0.3rem; font: inherit; font-weight: inherit; line-height: 1.4; color: var(--pico-muted-color); cursor: pointer; text-align: left; border-radius: 4px; transition: border-color 0.15s, color 0.15s, background 0.15s; }
    .th-filter-btn:not(:disabled):hover { border-color: var(--pico-primary); color: var(--pico-primary); background: color-mix(in srgb, var(--pico-primary) 8%, transparent); }
    .th-filter-btn:disabled { cursor: default; opacity: 1; }
    .th-filter-btn--active { border-color: var(--pico-primary) !important; color: var(--pico-primary) !important; font-weight: 600; background: color-mix(in srgb, var(--pico-primary) 12%, transparent) !important; }
    /* sort button — small ↕/▲/▼ beside the label */
    .col-filter__popup { position: absolute; z-index: 9999; min-width: 240px; max-width: 300px; background: var(--pico-card-background-color, #fff); border: 1px solid var(--pico-muted-border-color); border-radius: 8px; padding: 0.75rem; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .col-filter__popup-title { margin: 0 0 0.45rem !important; font-size: 0.72rem; font-weight: 700; color: var(--pico-muted-color); text-transform: uppercase; letter-spacing: 0.04em; }
    .col-filter__popup > input, .col-filter__popup > select { margin-bottom: 0 !important; font-size: 0.85rem; }
    /* checklist for multi-select (work type) */
    .col-filter__checklist { display: flex; flex-direction: column; gap: 0.15rem; margin-bottom: 0.1rem; }
    .col-filter__check-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; padding: 0.15rem 0; cursor: pointer; margin: 0 !important; }
    .col-filter__check-item input[type=checkbox] { display: inline-block !important; appearance: checkbox !important; -webkit-appearance: checkbox !important; width: auto !important; height: auto !important; margin: 0 !important; flex-shrink: 0; cursor: pointer; }
    /* date range inside popup */
    .col-filter__date-row { display: flex; flex-direction: column; gap: 0.5rem; }
    .col-filter__date-row > label { font-size: 0.82rem !important; font-weight: 500; margin-bottom: 0 !important; display: flex; flex-direction: column; gap: 0.2rem; }
    .col-filter__date-row > label > input { margin: 0 !important; width: 100%; font-size: 0.85rem; }
    /* popup action buttons */
    .col-filter__actions { display: flex; gap: 0.4rem; margin-top: 0.55rem; }
    .col-filter__apply { flex: 1; padding: 0.26rem 0.5rem !important; font-size: 0.82rem !important; margin: 0 !important; }
    .col-filter__clear { flex: 1; padding: 0.26rem 0.5rem !important; font-size: 0.82rem !important; margin: 0 !important; background: transparent !important; border: 1px solid var(--pico-muted-border-color) !important; color: var(--pico-muted-color) !important; border-radius: var(--pico-border-radius); cursor: pointer; }
    .col-filter__clear:hover { border-color: var(--pico-del-color, #c0392b) !important; color: var(--pico-del-color, #c0392b) !important; }
    /* triage action buttons */
    .action-cell { white-space: nowrap; }
    .action-cell form { margin: 0 !important; display: inline-flex; gap: 0.25rem; align-items: center; }
    .action-cell--sticky { position: sticky; right: 0; background: var(--pico-background-color, #fff); z-index: 1; box-shadow: -3px 0 8px rgba(0,0,0,0.07); }
    .triage-badge--saved      { font-size: 0.75rem; font-weight: 600; color: #059669; white-space: nowrap; }
    .triage-badge--dismissed  { font-size: 0.75rem; color: var(--pico-muted-color); white-space: nowrap; }
    /* score badges — 1-4 red, 5-7 amber, 8-10 green */
    .score-badge { display:inline-block; min-width:1.5rem; text-align:center; padding:0.1rem 0.35rem; border-radius:4px; font-size:0.78rem; font-weight:600; line-height:1.5; }
    .score-badge--1,.score-badge--2,.score-badge--3,.score-badge--4 { background:#fee2e2; color:#b91c1c; }
    .score-badge--5,.score-badge--6,.score-badge--7 { background:#fef3c7; color:#92400e; }
    .score-badge--8,.score-badge--9,.score-badge--10 { background:#d1fae5; color:#065f46; }
    .triage-btn { display: inline-block !important; width: auto !important; padding: 0.15rem 0.5rem !important; font-size: 0.75rem !important; margin: 0 !important; min-height: 0 !important; height: auto !important; background: transparent !important; border: 1px solid var(--pico-muted-border-color) !important; color: var(--pico-muted-color) !important; border-radius: 4px; cursor: pointer; line-height: 1.4 !important; }
    .triage-btn--save:hover    { background: #059669 !important; border-color: #059669 !important; color: #fff !important; }
    .triage-btn--dismiss:hover { background: #dc2626 !important; border-color: #dc2626 !important; color: #fff !important; }
    .triage-btn--reset { font-size: 0.82rem !important; opacity: 0.55; }
    /* pagination */
    .pagination { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
    .pagination__info { font-size: 0.875rem; color: var(--pico-muted-color); }
    .pagination__jump { display:inline-flex; align-items:center; gap:0.3rem; margin:0 !important; }
    .pagination__jump-label { display:inline-flex; align-items:center; gap:0.3rem; font-size:0.82rem; color:var(--pico-muted-color); margin:0 !important; white-space:nowrap; }
    .pagination__jump-input { width:4rem !important; padding:0.18rem 0.4rem !important; font-size:0.82rem !important; margin:0 !important; text-align:center; }
    .pagination__jump-btn { padding:0.18rem 0.6rem !important; font-size:0.82rem !important; margin:0 !important; }
    .pagination__perpage { display:inline-flex; align-items:center; gap:0.3rem; margin:0 0 0 0.5rem !important; }
    .pagination__perpage-label { display:inline-flex; align-items:center; gap:0.3rem; font-size:0.82rem; color:var(--pico-muted-color); margin:0 !important; white-space:nowrap; }
    .pagination__perpage-input { width:4rem !important; padding:0.18rem 0.4rem !important; font-size:0.82rem !important; margin:0 !important; text-align:center; }
    .no-results { color: var(--pico-muted-color); margin-top: 1.5rem; }
    .job-title-link { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--pico-primary); text-decoration: none; font-weight: 500; border-radius: 3px; padding: 0.1rem 0.2rem; margin: -0.1rem -0.2rem; display: inline-block; transition: background 0.15s; cursor: pointer; vertical-align: bottom; }
    .job-title-link:hover { background: rgba(0,0,0,0.04); text-decoration: underline; text-underline-offset: 2px; }
    /* ── slide-in job panel ── */
    .jpanel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .jpanel-overlay.is-open { opacity: 1; pointer-events: auto; }
    .jpanel { position: fixed; top: 0; right: 0; bottom: 0; width: 50%; background: var(--pico-background-color, #fff); box-shadow: -4px 0 32px rgba(0,0,0,0.15); z-index: 1001; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); overflow: hidden; }
    .jpanel.is-open { transform: translateX(0); }
    .jpanel__loading { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--pico-muted-color); font-size: 0.9rem; }
    .jpanel__header { padding: 1rem 1.25rem 0.8rem; border-bottom: 1px solid var(--pico-muted-border-color); flex-shrink: 0; }
    .jpanel__title-row { display: flex; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.2rem; }
    .jpanel__title { margin: 0; font-size: 1.05rem; font-weight: 700; flex: 1; line-height: 1.35; }
    .jpanel__close { background: none; border: 1px solid var(--pico-muted-border-color); border-radius: 4px; cursor: pointer; font-size: 0.9rem; color: var(--pico-muted-color); padding: 0.1rem 0.45rem; line-height: 1.6; flex-shrink: 0; transition: border-color 0.15s, color 0.15s; }
    .jpanel__close:hover { border-color: var(--pico-primary); color: var(--pico-primary); }
    .jpanel__company { margin: 0 0 0.45rem; font-size: 0.92rem; font-weight: 500; color: var(--pico-color); }
    .jpanel__meta-row { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .jpanel__posted { font-size: 0.78rem; color: var(--pico-muted-color); margin-right: 0.15rem; }
    .jpanel__apply-link { font-size: 0.8rem; color: var(--pico-primary); text-decoration: none; font-weight: 500; border: 1px solid var(--pico-primary); border-radius: 4px; padding: 0.1rem 0.5rem; transition: background 0.15s, color 0.15s; }
    .jpanel__apply-link:hover { background: var(--pico-primary); color: #fff; }
    .jpanel__body { display: grid; grid-template-columns: 210px 1fr; flex: 1; overflow: hidden; }
    .jpanel__meta { padding: 1rem 1rem 1rem 1.25rem; border-right: 1px solid var(--pico-muted-border-color); overflow-y: auto; font-size: 0.82rem; }
    .jpanel__dl { margin: 0 0 1rem; }
    .jpanel__dl dt { font-weight: 600; color: var(--pico-muted-color); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.1rem; }
    .jpanel__dl dd { margin: 0 0 0.6rem; color: var(--pico-color); }
    .jpanel__triage { display: flex; flex-direction: column; gap: 0.35rem; }
    .jpanel__scores { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .jpanel__score-item { display: flex; align-items: center; gap: 0.5rem; }
    .jpanel__score-label { font-size: 0.78rem; color: var(--pico-muted-color); flex: 1; }
    .jpanel__score-str { font-size: 0.82rem; }
    .jpanel__desc { padding: 1rem 1.25rem; overflow-y: auto; }
    .jpanel__desc-html { font-size: 0.88rem; line-height: 1.65; }
    .jpanel__desc-pre { white-space: pre-wrap; font-family: inherit; font-size: 0.88rem; line-height: 1.6; }
    .jpanel__empty { color: var(--pico-muted-color); }
    .cell-truncate { display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
    /* ── responsive breakpoints ── */
    @media (max-width: 1100px) {
      .jpanel { width: 70%; }
    }
    @media (max-width: 768px) {
      .container-fluid { padding: 0.75rem; }
      .jpanel { width: 95%; }
      .jpanel__body { grid-template-columns: 1fr; }
      .jpanel__meta { border-right: none; border-bottom: 1px solid var(--pico-muted-border-color); }
      .job-title-link { max-width: 180px; }
    }
    @media (max-width: 480px) {
      .jpanel { width: 100%; }
      .col-picker { flex-direction: column; align-items: flex-start; }
    }
    /* ── sources page ── */
    .page-heading { margin: 0 0 1.25rem; font-size: 1.1rem; font-weight: 700; }
    .source-card { margin-bottom: 1.5rem; }
    .source-card__header { display: flex; justify-content: space-between; align-items: center; }
    .source-card__name { font-size: 0.95rem; font-weight: 700; }
    .source-card__actions { display: flex; gap: 0.4rem; align-items: center; }
    .source-card__actions form { margin: 0 !important; }
    .source-action-btn { padding: 0.22rem 0.75rem !important; font-size: 0.82rem !important; margin: 0 !important; }
    .source-fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.75rem 1.5rem; margin-top: 0.75rem; align-items: end; }
    .source-field--full { grid-column: 1/-1; }
    .source-field__label { margin: 0 0 0.35rem !important; font-size: 0.875rem; font-weight: 500; }
    .source-hint { display: block; color: var(--pico-muted-color); font-size: 0.78rem; margin: 0.1rem 0 0.3rem; line-height: 1.35; }
    .source-toggle { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0 1rem !important; }
    .source-toggle--inline { display: flex; align-items: center; gap: 0.5rem; margin: 0 !important; }
    .source-toggle input[type=checkbox], .source-toggle--inline input[type=checkbox] { width: auto !important; margin: 0 !important; flex-shrink: 0; }
    .source-save-btn { margin-top: 1rem !important; }
    /* tag-chip keyword input */
    .tag-input { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; padding: 0.35rem 0.45rem; border: 1px solid var(--pico-muted-border-color); border-radius: 4px; background: var(--pico-background-color); min-height: 2.4rem; cursor: text; transition: border-color 0.15s; }
    .tag-input:focus-within { border-color: var(--pico-primary); }
    .tag-input__chip { display: inline-flex; align-items: center; gap: 0.2rem; background: color-mix(in srgb,var(--pico-primary) 12%,transparent); color: var(--pico-primary); border: 1px solid color-mix(in srgb,var(--pico-primary) 35%,transparent); border-radius: 999px; padding: 0.1rem 0.45rem; font-size: 0.8rem; white-space: nowrap; line-height: 1.4; }
    .tag-input__remove { background: none !important; border: none !important; padding: 0 0.05rem !important; margin: 0 !important; min-height: 0 !important; font-size: 0.82rem; color: inherit !important; cursor: pointer; line-height: 1; opacity: 0.65; width: auto !important; }
    .tag-input__remove:hover { opacity: 1; }
    .tag-input__text { border: none !important; outline: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; min-width: 100px; flex: 1; background: transparent !important; font: inherit; color: inherit; width: auto !important; min-height: 0 !important; }
    /* ── schedule page ── */
    .sched-status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding: 0.6rem 1rem; background: var(--pico-card-sectioning-background-color, #f8f8f8); border-radius: 6px; border: 1px solid var(--pico-muted-border-color); }
    .sched-status-actions { display: flex; gap: 0.5rem; align-items: center; }
    .sched-status-actions form { margin: 0 !important; }
    .sched-status--on { color: #059669; }
    .sched-status--off { color: var(--pico-muted-color); }
    .sched-run-badge { margin-left: 0.5rem; }
    .sched-toggle-btn { padding: 0.22rem 0.8rem !important; font-size: 0.82rem !important; margin: 0 !important; }
    .sched-ai-row { display: flex; align-items: center; gap: 1rem; }
    .sched-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; }
    .sched-time-row { display: flex; gap: 1rem; }
    .sched-time-row label { flex: 1; }
    .sched-section { margin-top: 1rem; }
    .sched-section__label { margin: 0 0 0.4rem !important; font-size: 0.875rem; font-weight: 500; }
    .sched-order-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
    .sched-order-num { color: var(--pico-muted-color); min-width: 1.2rem; font-size: 0.82rem; text-align: right; flex-shrink: 0; }
    .sched-order-row select { margin: 0 !important; flex: 1; }
    .sched-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    .sched-save-btn { margin-top: 1.25rem !important; width: 100% !important; }
    .sched-save-row { margin-top: 1rem; display: flex; justify-content: flex-end; }
    .sched-save-row .sched-save-btn { width: auto !important; padding-left: 2.5rem !important; padding-right: 2.5rem !important; margin-top: 0 !important; }
    .sched-table { font-size: 0.85rem; }
    .sched-error-cell { font-size: 0.78rem; color: var(--pico-del-color); padding-top: 0 !important; }
    .sched-viewlog { margin-top: 0.75rem !important; }
    .sched-viewlog a { font-size: 0.85rem; }
    .sched-empty { color: var(--pico-muted-color); }
    .sched-scraper-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem 1.5rem; align-items: end; }
    .sched-field--full { grid-column: 1/-1; }
    /* ── analyse page ── */
    .analyse-actions { display: flex; gap: 0.75rem; align-items: center; margin: 1.25rem 0; }
    .analyse-error { color: var(--pico-del-color); }
    .flash-ok { color: var(--pico-ins-color); }
    .ai-settings-back { font-size: 0.82rem; font-weight: 400; color: var(--pico-muted-color); text-decoration: none; margin-left: 0.9rem; }
    .ai-settings-back:hover { color: var(--pico-primary); }
    /* ── ai settings page ── */
    .ai-settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1.5rem; align-items: start; }
    .ai-settings-narrow { max-width: 28rem; }
    /* ── field editor ── */
    .field-editor-header { display: grid; grid-template-columns: 1fr 80px 2fr auto; gap: 0.6rem; padding: 0 0 0.25rem; font-size: 0.8rem; font-weight: 600; color: var(--pico-muted-color); }
    .field-editor-row { display: grid; grid-template-columns: 1fr 80px 2fr auto; gap: 0.6rem; align-items: end; margin-bottom: 0.4rem; }
    .field-editor-row input, .field-editor-row select { margin-bottom: 0 !important; }
    .field-remove-btn { padding: 0.3rem 0.6rem !important; min-width: unset !important; }
    .field-add-btn { margin-top: 0.6rem; }
    /* ── preview modal ── */
    dialog.preview-modal { max-width: 800px; width: 90vw; }
    .preview-pre { white-space: pre-wrap; font-family: inherit; font-size: 0.85rem; line-height: 1.6; background: var(--pico-card-sectioning-background-color, #f8f8f8); border-radius: 6px; padding: 1rem; margin: 0; max-height: 400px; overflow-y: auto; }
    /* ── job detail page ── */
    .jd-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .jd-back { font-size: 0.85rem; color: var(--pico-muted-color); text-decoration: none; }
    .jd-back:hover { color: var(--pico-primary); }
    .jd-title { margin: 0.25rem 0 0.5rem !important; }
    .jd-badges { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .jd-layout { display: grid; grid-template-columns: 1fr 3fr; gap: 2rem; }
    .jd-dl { font-size: 0.85rem; }
    .jd-dl dt { font-weight: 600; margin-bottom: 0 !important; }
    .jd-dl dd { margin-bottom: 0.5rem !important; color: var(--pico-muted-color); }
    .jd-triage-heading { margin-top: 1.5rem !important; }
    .jd-triage-form { display: flex; flex-direction: column; gap: 0.4rem; }
    .jd-desc { font-size: 0.9rem; line-height: 1.6; }
    .jd-desc-pre { white-space: pre-wrap; font-family: inherit; font-size: 0.9rem; }
    .jd-no-desc { color: var(--pico-muted-color); }
    /* ── runs page ── */
    .runs-heading { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem; }
    .runs-refresh-btn { padding: 0.15rem 0.7rem !important; font-size: 0.8rem !important; margin: 0 !important; }
    .runs-inline-form { display: contents; }
    .runs-del-col { width: 2rem; padding: 0 !important; text-align: center; }
    .runs-row-del-btn { padding: 0.15rem 0.5rem !important; font-size: 0.78rem !important; margin: 0 !important; border-color: var(--pico-muted-border-color) !important; color: var(--pico-muted-color) !important; }
    .runs-row-del-btn:hover { border-color: #dc2626 !important; color: #dc2626 !important; }
    .runs-error-cell { max-width: 300px; font-size: 0.8rem; color: var(--pico-muted-color); }
    .runs-kill-btn { padding: 0.22rem 0.9rem !important; font-size: 0.82rem !important; margin: 0 !important; border-color: #dc2626 !important; color: #dc2626 !important; }
    .runs-kill-btn:hover { background: #dc2626 !important; color: #fff !important; }
  </style>
  {% block head %}{% endblock %}
