services:
  jobboard:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env                             # provides DATABASE_URL (Supabase)
    volumes:
      - ./data:/app/data                 # still useful for any local files (logs, sentinels)
      - ./config.yaml:/app/config.yaml   # edit config without rebuilding
    restart: unless-stopped
