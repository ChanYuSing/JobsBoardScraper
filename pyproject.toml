[project]
name = "jobboard"
version = "0.2.0"
description = "Multi-source job-board scraper (LinkedIn + JobsDB) with AI scoring"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.11", "pyinstaller-hooks-contrib>=2025.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobboard = ["*.graphql", "*.sql"]
"jobboard.sources.linkedin" = ["*.sql"]
"jobboard.sources.jobsdb" = ["*.sql", "*.graphql"]
"jobboard.web" = ["templates/*.html"]
