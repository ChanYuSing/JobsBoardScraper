sources:
  jobsdb:
    enabled: true
    url: "https://hk.jobsdb.com/jobs?daterange=1"
    page_size: 32

  linkedin_guest:
    enabled: true
    location: "Hong Kong"
    keywords: ["machine learning"]
    hours_old: 720         # f_TPR filter — last N hours (720 = 30 days); set null to disable
    job_type: null         # fulltime | parttime | contract | internship | null (all)
    is_remote: null        # true = remote only | false = on-site | "hybrid" = hybrid | null = all
    experience_level: null # 1=internship | 2=entry | 3=associate | 4=mid-senior | 5=director | 6=executive | [2,3,4] = multi | null = all
    easy_apply: null       # true = LinkedIn Easy Apply only | null = all
    sort_by_date: null     # true = f_SB2=R — most-recent postings first | null = LinkedIn default relevance sort
    geo_id: null           # LinkedIn numeric geoId for precision (e.g. 102234630=HK); overrides location text
    industry_id: null      # LinkedIn industry code: 96=technology | 4=software | 43=financial services | null = all



scraper:
  request_timeout_seconds: 20
  retries: 3
  jitter_ms: [1000, 3000]     # Random delay between retries to avoid hammering servers
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36"

storage:
  sqlite_path: "data/jobs.sqlite"
