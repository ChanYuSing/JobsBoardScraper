sources:
  jobsdb:
    enabled: false
    keywords: null
    location: Hong Kong SAR        # e.g. "Hong Kong SAR", "Singapore", "Sydney NSW"
    daterange: '3'                 # days: 1 | 3 | 7 | 30
    work_arrangement: null         # null | "remote" | "hybrid" | "onsite"
    work_type: null                # null | "full_time" | "part_time" | "contract"
    classification: null
    subclassification: null
    salary_range: null
    salary_type: null
    sort_mode: null
    page_size: 32
    start_page: 1
    max_pages: 0                   # 0 = no limit

  linkedin_guest:
    enabled: false
    location: Hong Kong            # city / region as LinkedIn recognises it
    keywords:
    - software engineer            # add or remove keywords for your field
    hours_old: 72
    job_type: null                 # null | "full_time" | "part_time" | "contract"
    is_remote: null
    experience_level: null
    easy_apply: null
    sort_by_date: null
    geo_id: null
    industry_id: null

scraper:
  request_timeout_seconds: 30
  retries: 3
  jitter_ms:
  - 1000
  - 3000
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36

storage:
  sqlite_path: data/jobs.sqlite

scheduler:
  enabled: false
  cron: 0 0 * * *                 # daily at midnight; standard cron syntax
  order:
  - jobsdb
  - linkedin_guest

ai:
  provider: ollama                 # ollama | openai | grok | gemini | deepseek | anthropic | lmstudio | openai_compat
  model: llama3.2                  # model name for the chosen provider
  base_url: ''                     # leave empty to use the provider default URL
  api_key: ''                      # your API key (or set AI_API_KEY env var)
  api_keys: {}                     # per-provider keys, populated via the UI
  models: {}                       # per-provider last-used model, populated via the UI
  base_urls: {}                    # per-provider last-used base URL, populated via the UI
  auto_score: false
  auto_score_preset_names: []
  provider_params: {}              # per-provider parameter overrides, set via the UI
  system_prompt: "You are an experienced career advisor. Your job is to evaluate how\
    \ well a candidate's profile matches a specific job opening. Be objective and realistic.\r\
    \n\r\nScoring Guidelines:\r\n- 9\u201310 = Excellent/Outstanding fit\r\n- 7\u2013\
    8  = Strong fit with minor caveats\r\n- 5\u20136  = Moderate/Partial fit \u2013\
    \ viable but has clear weaknesses\r\n- 3\u20134  = Weak fit \u2013 significant\
    \ concerns\r\n- 1\u20132  = Poor fit \u2013 unlikely to succeed or highly misaligned\r\
    \n\r\nBe concise and sharp in your reasoning."
  cv: Paste your CV here.
  fields:
  - name: skills_match
    type: int
    description: How well the candidate's technical skills, projects, and experience
      directly match the job's core requirements and responsibilities. (1-10)
  - name: seniority_fit
    type: int
    description: How well the candidate's experience level matches the expected seniority
      (1-10)
  - name: growth_value
    type: int
    description: How valuable this role would be for the candidate's long-term career
      growth, skill development, and future opportunities. (1-10)
  - name: overall
    type: int
    description: Overall recommendation score — should the candidate apply? (1-10)
  - name: verdict
    type: str
    description: One or two sentence sharp verdict. Include the strongest reason to
      apply OR the key reason to hesitate.
  prompt_fields:
  - title
  - company
  - location
  - description_text
  - bullet_points
  - work_types
  - work_arrangement
  - salary_label
  - listing_date_label
  - date_posted
  - employment_type
  - seniority_level
